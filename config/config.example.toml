# Persistent manager state. systemd creates this directory for the service user.
state_file = "/var/lib/mihomo-node-manager/state.json"

# This is a strict allowlist. The service never selects any other Mihomo node.
# The names must match your Mihomo proxy inventory verbatim - copy them from
# `GET /providers/proxies` (or the `all` list of `GET /proxies/{group}`),
# including emoji, spaces and casing. Names shown in subscription GUIs often
# differ from the API names.
allowed_nodes = [
  "node-01",
  "node-02",
  "node-03",
  "node-04",
  "node-05",
  "node-06",
]

[mihomo]
base_url = "http://127.0.0.1:9090"
group = "PROXY"
# Leave empty while the loopback Mihomo API has no secret. If a secret is added
# later, place only the secret in a mode-0600 file and set its path here.
secret_file = ""
request_timeout_ms = 6000

[probe]
url = "https://www.gstatic.com/generate_204"
expected_status = "204"
timeout_ms = 5000
interval_seconds = 60
concurrency = 4
history_size = 10

[policy]
ewma_alpha = 0.35
failure_threshold = 2
recovery_threshold = 2
min_dwell_seconds = 600
improvement_ratio = 0.20
improvement_ms = 100
better_rounds = 3
manual_override_seconds = 1800

[pingpong]
# CPA (cli-proxy-api) Gemini ping-pong probe. The CPA's upstream Google traffic
# egresses through Mihomo's currently selected node, so a real completion
# request through the CPA tells us whether the exit node passes Google's
# location risk control ("User location is not supported").
#
# The endpoint, API key and model are read from the environment, optionally
# seeded by env_file (see .env.example at the repository root):
#   CPA_BASE_URL, CPA_API_KEY, CPA_MODEL
# When CPA_BASE_URL or CPA_MODEL is empty the probe stays disabled and the
# service behaves exactly like before this section existed.
#
# env_file is resolved against the process working directory: the systemd unit
# sets WorkingDirectory=/etc/mihomo-node-manager, so on the server this points
# at /etc/mihomo-node-manager/.env while locally it is ./.env.
env_file = ".env"
enabled = true
# The currently selected node is re-tested every refresh_interval_seconds
# without switching the group.
refresh_interval_seconds = 300
# A node that returned the location ban is excluded from switching targets for
# fail_ttl_seconds; after that it becomes "unknown" and may be re-tested.
fail_ttl_seconds = 1800
timeout_seconds = 20
max_tokens = 16
prompt = "ping"
# When the current node turns dirty, this node is tested and preferred first
# before scanning the rest by latency. Must be one of allowed_nodes; leave
# empty to disable the preference.
safe_node = ""
# Close the group's existing connections after a switch or test so clients
# (the CPA included) re-dial through the new node immediately. This also keeps
# ping-pong results from being polluted by connections pinned to old nodes.
close_conns_on_switch = true

# Optional override for the "dirty" verdict. Omitted, the built-in rule marks a
# node dirty on the Gemini location ban: HTTP 400 whose body contains
# "user location is not supported" or "failed_precondition". Uncomment and
# adapt it if your CPA fronts a different provider.
#
# [pingpong.dirty_match]
# status = 400
# body_contains = ["user location is not supported", "failed_precondition"]

[api]
# The program rejects non-loopback listen addresses.
listen = "127.0.0.1:9123"

[logging]
level = "info"
